apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: pubsub
spec:
  type: pubsub.redis
  version: v1
  # Generous init timeout: sidecars can start before the Redis container is ready (slow pull)
  initTimeout: 120s
  metadata:
  - name: redisHost
    value: localhost:6390
  - name: redisPassword
    value: daprdemos
  - name: enableTLS
    value: "true"
  # Backstop only: demo 02's visible retries come from the inbound retry policy in `resiliency.yaml`,
  # which holds a message in flight for up to ~20s. These values stay well above that window so the
  # reclaim loop never delivers a duplicate on top of a retry that is still running.
  - name: processingTimeout
    value: 60s
  - name: redeliverInterval
    value: 15s
scopes:
- demo01-publisher
- demo01-subscriber
- demo02-subscriber
- demo04-outbox
