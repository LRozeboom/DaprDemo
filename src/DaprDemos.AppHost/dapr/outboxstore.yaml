apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: outboxstore
spec:
  type: state.postgresql
  version: v1
  # Generous init timeout: sidecars can start before the Postgres container is ready (slow pull)
  initTimeout: 120s
  metadata:
  - name: connectionString
    value: host=localhost port=5433 user=postgres password=daprdemos database=postgres sslmode=disable
  # keep the key in the database the literal `order-<id>` the code
  - name: keyPrefix
    value: none
  - name: outboxPublishPubsub
    value: pubsub
  - name: outboxPublishTopic
    value: orders
scopes:
- demo04-outbox
