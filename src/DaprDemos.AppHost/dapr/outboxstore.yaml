apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: outboxstore
spec:
  # Postgres, not Redis, on purpose. Dapr's Redis state store runs a "transaction" as a Redis
  # pipeline and cannot roll back: a failing operation still leaves the outbox marker row behind,
  # so the event would be published for an order that was never stored — the exact bug the outbox
  # is supposed to prevent. Postgres gives a real BEGIN/ROLLBACK. (Dapr itself warns about this in
  # the Redis component's logs.)
  type: state.postgresql
  version: v1
  # Generous init timeout: sidecars can start before the Postgres container is ready (slow pull)
  initTimeout: 120s
  metadata:
  - name: connectionString
    value: host=localhost port=5433 user=postgres password=daprdemos database=postgres sslmode=disable
  # Same reason as statestore.yaml: keep the key in the database the literal `order-<id>` the code
  # names, so the `psql` inspection in the README shows what the demo says it stores.
  - name: keyPrefix
    value: none
  # --- the entire outbox pattern, in two lines of YAML ---
  # When an app runs a state transaction against this store, daprd writes a marker row inside that
  # same transaction and publishes the message only once the transaction has committed.
  - name: outboxPublishPubsub
    value: pubsub
  - name: outboxPublishTopic
    value: orders
scopes:
- demo04-outbox
